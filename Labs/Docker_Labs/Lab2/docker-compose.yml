services:
  model-training:
    image: python:3.10-slim
    container_name: ml_trainer
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - model_exchange:/exchange
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python src/model_training.py &&
             cp my_model.keras scaler.pkl knn_model.pkl /exchange/"

  serving:
    image: python:3.10-slim
    container_name: ml_serving
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - ./src/templates:/app/src/templates
      - ./src/statics:/app/src/statics
      - model_exchange:/exchange
    depends_on:
      model-training:
        condition: service_completed_successfully
    command: >
      sh -c "pip install --no-cache-dir --trusted-host pypi.python.org -r requirements.txt &&
             cp /exchange/my_model.keras /exchange/scaler.pkl /exchange/knn_model.pkl /app/ &&
             python src/main.py"

volumes:
  model_exchange:
